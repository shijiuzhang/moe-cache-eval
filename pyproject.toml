[project]
name = "moe-cache-eval"
version = "0.1.0.dev0"
description = "Open Inference Capacity and Acceptance Platform measurement kernel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psutil>=7,<8",
    "pyyaml>=6,<7",
]

[dependency-groups]
research = [
    "accelerate>=1.12,<2",
    "huggingface-hub>=0.36,<2",
    "numpy>=2,<3",
    "nltk>=3.9,<4",
    "safetensors>=0.7,<1",
    "scipy>=1.17,<2",
    "pyarrow>=19,<24",
    "pypdf>=6,<7",
    "sentencepiece>=0.2,<1",
    "tenacity>=9,<10",
    "torch==2.13.0",
    "transformers==4.57.6",
    "wonderwords>=3.0,<4",
]

[project.scripts]
oicap = "oicap.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moe_controller*", "oicap*"]

[tool.setuptools.package-data]
oicap = ["schemas/0.1/*.json"]

[tool.uv]
default-groups = ["research"]
