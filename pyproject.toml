[project]
name = "moe-cache-eval"
version = "0.1.0"
description = "Trace-driven measurement and evaluation tools for MoE expert caching"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12,<2",
    "huggingface-hub>=0.36,<2",
    "numpy>=2,<3",
    "nltk>=3.9,<4",
    "safetensors>=0.7,<1",
    "scipy>=1.17,<2",
    "pyarrow>=19,<24",
    "pypdf>=6,<7",
    "sentencepiece>=0.2,<1",
    "tenacity>=9,<10",
    "torch==2.13.0",
    "transformers==4.57.6",
    "wonderwords>=3.0,<4",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
